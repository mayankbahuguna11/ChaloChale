<!-- form starts here -->
<div class="container mt-4">

  
    <div class="booking-box">
  <form action="">

    <div class="modal-header bg-primary text-light">  
        <h1 class="modal-title fs-5" id="exampleModalLabel">Book Your Trip</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
          <!-- first row -->
         <div class="row">

          <div class="col-6">
             <div class="mb-3">
              <label for="exampleFormControlInput1" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Enter your name">
             </div>
          </div>

          
            <div class="col-6">
              <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Email address</label>
               <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
              </div>
            </div>

         </div>

<!-- second row -->
 <div class="row">

  <div class="col-6">
    <label for="exampleFormControlInput1" class="form-label">Select destination</label>
    <select class="form-select" aria-label="Default select example">
  <option selected>Open this select menu</option>
  <option value="1">Goa</option>
  <option value="2">Manali</option>
  <option value="3">Kerala</option>
  <option value="4">Jaipur</option>
</select>
  </div>

  <div class="col-6">

    <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Date</label>
               <input type="date" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
              </div>
  </div>
 </div>

 <!-- row 3 -->

 <div class="row">
 <div class="col-12">

   
          
      <label for="exampleFormControlInput1" class="form-label">Number of peoples</label>
      <input type="number" class="form-control" id="exampleFormControlInput1" placeholder="">
             
 </div>
 </div>

<!-- 4th row -->
 <div class="row">
 <div class="col-12">
 
 
<div class="mb-3">
  <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
  <textarea class="form-control" id="exampleFormControlTextarea1" rows="3" placeholder="any"></textarea>
</div>

</div>
 </div>

  <div class="d-grid gap-2">
  <button class="btn btn-primary w-70 m-4" type="button">Button</button>
